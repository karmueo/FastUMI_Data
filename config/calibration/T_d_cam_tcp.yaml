# 部署端（RM75 + 腕部鱼眼相机）夹爪抓取中心 TCP 在相机坐标系 Cd 中的位姿。
# T_d_cam_tcp = ^Cd T_tcp（即 D = inv(A_u) @ A_d 中的 A_d），采用列向量，平移单位为米。
# p_cam = T_d_cam_tcp @ p_tcp
#
# 计算：T_d_cam_tcp = T_cam_dtag @ T_d_tag_tcp
#   T_cam_dtag：^Cd T_d_tag，由 keyboard_tag_tcp_capture 实测；
#   T_d_tag_tcp：config/calibration/T_d_tag_tcp.yaml（其中 120 mm / -18 mm 尚未实测）。
# 来源：dataset/h5dy_data/tag_tcp/session_20261027_092012
#   20 个位姿全部为内点；位姿间离散度 0.12 mm / 0.07°；平均重投影 RMS 0.88 px；
#   tag 间距 133.0 mm，夹爪开度 1.0；内参 fastumi_usb_camera/config/EndEffectorCalib.yaml。
#
# TCP 坐标轴沿用 d_tag 约定（不是法兰轴向）：
#   +X：沿两 tag 连线，由 ID 0 指向 ID 1；
#   +Y：由 tag 指向 TCP（手指伸出方向）；
#   +Z：X × Y，指向相机一侧。
# TCP 在相机系约 [-1.8, 74.0, 209.8] mm；相机在 TCP 系约 [2.6, -205.6, 84.9] mm。
# 结合 T_cam_end.yaml 得到 ^Link7 T_tcp 平移约 [-2.1, -2.1, 225.9] mm（名义 T_end_tcp 为 200 mm）。
# 修正 T_d_tag_tcp.yaml 后需用 T_cam_dtag 重新相乘：
#   T_cam_dtag = [[0.9997049008757919, -0.005649171586383259, -0.023626214790139904, -0.0015279901882016811],
#                 [-0.023891906186726142, -0.05281688317366207, -0.9983183628835957, 0.06235476631279574],
#                 [0.004391808703359941, 0.9985882353163417, -0.05293626643526808, 0.08900012907009412],
#                 [0.0, 0.0, 0.0, 1.0]]
# 固定安装变换，不随机械臂关节角变化。
T_d_cam_tcp:
  - [0.9997049008757919, -0.005649171586383259, -0.023626214790139904, -0.001780618912345154]
  - [-0.023891906186726142, -0.05281688317366207, -0.9983183628835957, 0.07398647086386101]
  - [0.004391808703359941, 0.9985882353163417, -0.05293626643526808, 0.20978357010388993]
  - [0.0, 0.0, 0.0, 1.0]
