# 该文件把同目录 T_cam_tracker.yaml 的原始字节绑定到标定所用 Tracker，
# 供 convert_mcap 在转换前核对设备身份；修改外参文件后须同步更新摘要。
schema_version: 1
# 被绑定外参文件名（同目录）及其原始字节 SHA-256。
calibration_file: T_cam_tracker.yaml
calibration_sha256: cce6807d8266935d6d5a9429773527707766ae007d7f66f167de4e662947c166
# 标定数据来源记录中 /vive_tracker/status 全部 3523 条均为该序列号，且连接与跟踪有效。
tracker_serial: LHR-B77A06A7
source_collection_uuid: 5359836d-b6db-4ed7-ab6c-19ec4c516de8
source_status_topic: /vive_tracker/status
# 原始标定报告：timeOffset (t_eye = t_hand + offset)，即 t_camera = t_tracker + offset，单位秒。
time_offset_convention: t_camera_eq_t_tracker_plus_offset
# 旧 now() 时间戳链路的标定，只用于流程验证；新链路重新标定并验收后才可改为 verified。
time_calibration_status: provisional
# 标定数据的图像 Header 时间戳来源；convert_mcap 要求与每条记录的时间戳来源一致。
# 实测新 V4L2 缓冲区时间比回调 now() 早约 33 ms，与本偏移量级相同，因此不能混用。
time_calibration_timestamp_source: callback_now
time_calibration_conditions: >-
  2026-10-12 tag_jpeg_1 记录，约 30 Hz JPEG，图像 Header 为回调 now()，
  非 V4L2 SOE→ROS 映射时间戳。
