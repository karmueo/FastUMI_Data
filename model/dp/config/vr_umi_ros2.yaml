# ROS2 Link7 推理配置；checkpoint 必须在启动时显式提供。
vr_umi_inference:
  ros__parameters:
    device: cuda:0
    # 正式夹爪 URDF 的默认摘要；旧版训练摘要仅允许已登记的等价迁移。
    expected_urdf_sha256: 2724631527c06ac53efc8dd247671995e32b40f07818ba49a6f2c0408be63607
    image_topic: /camera/image_raw
    joint_topic: /joint_states
    gripper_topic: /fastumi/gripper/state
    output_topic: /fastumi/policy/action_sequence
    reset_service: /fastumi/policy/reset_episode
    sync_slop_s: 0.05
    input_timeout_s: 0.2
    history_tolerance_s: 0.015
    max_inference_hz: 10.0
    result_timeout_s: 0.5
    # 逗号分隔的 module:factory；工厂返回具有 process 方法的处理器。
    postprocessors: ""
