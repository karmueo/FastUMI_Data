# ROS2 Link7 推理配置；checkpoint 必须在启动时显式提供。
vr_umi_inference:
  ros__parameters:
    device: cuda:0
    # 旧 checkpoint 未内嵌该字段；必须显式绑定训练时使用的 URDF 原始文件摘要。
    expected_urdf_sha256: c37545834f0d6a4719548e51337a258be0c3b95bb6b79467d835875a205bb056
    image_topic: /camera/image_raw
    joint_topic: /joint_states
    gripper_topic: /fastumi/gripper/state
    output_topic: /fastumi/policy/action_sequence
    reset_service: /fastumi/policy/reset_episode
    sync_slop_s: 0.05
    input_timeout_s: 0.2
    history_tolerance_s: 0.015
    max_inference_hz: 10.0
    result_timeout_s: 0.5
    # 逗号分隔的 module:factory；工厂返回具有 process 方法的处理器。
    postprocessors: ""
