[project]
name = "fastumi-diffusion-policy"
version = "0.1.0"
description = "FastUMI 本地 Diffusion Policy 训练与推理项目"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==0.24.1",
    "diffusers==0.18.2",
    "dill==0.3.7",
    "einops>=0.7,<1",
    "filelock>=3.13,<4",
    "h5py>=3.10,<4",
    "huggingface-hub>=0.20,<0.26",
    "hydra-core==1.3.4",
    "imagecodecs>=2023.9.18",
    "numpy==1.26.4",
    "omegaconf>=2.3,<2.4",
    "opencv-contrib-python>=4.7,<5",
    "packaging>=23,<26",
    "pandas>=2.1,<2.4",
    "pillow>=10,<12",
    "psutil>=5.9,<7",
    "pyyaml>=6,<7",
    "scipy==1.13.1",
    "threadpoolctl>=3.2,<4",
    "timm==0.9.7",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "tqdm>=4.66,<5",
    "wandb>=0.16,<0.29",
    "zarr==2.18.3",
    "numcodecs==0.12.1",
]

[dependency-groups]
test = [
    "pytest>=8.0,<9",
]
validation = [
    "matplotlib>=3.8,<4",
]

[[tool.uv.index]]
name = "jetson-jp6-cu126"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126/+simple"
explicit = true

[tool.uv.sources]
torch = { index = "jetson-jp6-cu126" }
torchvision = { index = "jetson-jp6-cu126" }

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
