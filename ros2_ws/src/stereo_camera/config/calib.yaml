# ============================================================
# 双目相机-IMU 标定结果
# 坐标系：IMU 坐标系 → cam0/cam1 相机坐标系
# 畸变模型：鱼眼畸变模型（fisheye），系数顺序 [k1, k2, k3, k4]
# 变换方向：T_cam_imu 表示点从 IMU 坐标系变换到相机坐标系
#           T_cam1_cam0 表示点从 cam0（左）变换到 cam1（右）
# ============================================================

cam0:
  # IMU → cam0 变换矩阵 (4x4)，平移单位 mm
  T_cam_imu: [
    [0.999991627382618, -0.00403265455774482, 0.000694882637900548, 45.2244285394535],
    [-0.00403571535894397, -0.999981905372736, 0.00446115777055264, 2.43504610722895],
    [0.000676879756041985, -0.00446392476751999, -0.99998980755279, -19.3828035634955],
    [0, 0, 0, 1]
  ]
  # 相机内参 [fx, fy, cx, cy] (像素)
  intrinsics: [675.3400977838689, 675.0669178087476, 945.3365631063257, 568.4698921303237]
  # 畸变系数 [k1, k2, k3, k4]
  distortion_model: fisheye
  distortion_coeffs: [0.39371303768602134, 0.15071624229947425, -0.13782997983842898, 0.07147440566690481]
  # 分辨率 [width, height] (像素)
  resolution: [1920, 1080]

cam1:
  # IMU → cam1 变换矩阵 (4x4)，平移单位 mm
  T_cam_imu: [
    [0.999932611588032, -0.0115981930309598, -0.000504183651277702, -53.8043773599705],
    [-0.0116033169784328, -0.999863660811742, -0.0117483115058821, 2.65727529867738],
    [-0.000367855726654887, 0.0117533700085476, -0.999930859097571, -19.713790432944],
    [0, 0, 0, 1]
  ]
  # 相机内参 [fx, fy, cx, cy] (像素)
  intrinsics: [676.6309509962041, 676.3942903544906, 955.1602489815064, 518.0650072693021]
  # 畸变系数 [k1, k2, k3, k4]
  distortion_model: fisheye
  distortion_coeffs: [0.3966202570429266, 0.1518394466103733, -0.14508889529604302, 0.07765365551334684]
  # 分辨率 [width, height] (像素)
