# ============================================================
# 左相机 → 右相机的变换 (cam0 → cam1)
# 变换矩阵 T_cam1_cam0 (4x4): p_cam1 = T_cam1_cam0 * p_cam0
# 平移单位：mm
# ============================================================
T_cam1_cam0: [
    [0.99997066069239, 0.00756029052467153, 0.00123278611573196, -99.0219938508982],
    [-0.00757927877709361, 0.999839985264864, 0.0162036538711124, 0.879459626136237],
    [-0.00111008452096135, -0.0162125220967707, 0.999867952201498, -0.243865149076781],
    [0, 0, 0, 1]
  ]

# ============================================================
# IMU 偏置
# 使用方式：真实值 = 原始测量值 - bias
#   accelerometer_bias 单位：m/s²
#   gyroscope_bias     单位：deg/s（转 rad/s 需 ×π/180）
# ============================================================
imu:
  # 加速度计偏置 (m/s²)
  accelerometer_bias: [0.3940591850757028, -0.21056769832549982, -0.4209784554965755]
  # 陀螺仪偏置 (deg/s)
  gyroscope_bias: [0.07920756903296618, 1.8943795654082396, 1.0376527938916122]