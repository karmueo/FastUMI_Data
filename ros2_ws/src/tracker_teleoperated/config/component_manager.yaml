# 本文件定义面板管理范围、双 Python 环境及启动参数；observe 仅监测外部节点。
workspace_root: ""
discovery_wait_s: 2.0
startup_grace_s: 30.0
save_timeout_s: 300.0
components:
  arm:
    label: RM75 驱动
    mode: observe
    nodes: [/rm_driver]
  tracker:
    label: VIVE Tracker
    mode: auto
    nodes: [/vive_tracker/pose_publisher]
    parameters: {}
  gripper:
    label: Unitree 夹爪
    mode: observe
    nodes: [/dex1_gripper_node]
  umi_camera:
    label: UMI 相机
    health_timeout_s: 1.0
    mode: auto
    nodes: [/umi_camera/usb_camera_node]
    parameters: {video_device: /dev/v4l/by-path/pci-0000:06:00.4-usb-0:2.2:1.0-video-index0, namespace: umi_camera, frame_id: umi_camera_optical_frame, publish_compressed: 'false'}
  estimator:
    label: 夹爪预测
    mode: auto
    nodes: [/gripper_openness_estimator]
    parameters: {image_topic: /umi_camera/image_raw}
  wrist_encoder:
    label: 末端视频编码
    health_timeout_s: 1.0
    mode: observe
    nodes: [/usb_camera_ffmpeg]
    parameters: {topic: /wrist_camera/image_raw}
  wrist_decoder:
    label: H.264 视频解码
    health_timeout_s: 1.0
    mode: auto
    nodes: [/usb_camera_receiver]
    parameters: {input_topic: /wrist_camera/image_raw, output_topic: /wrist_camera/image_decoded, decoder_backend: cuda, output_queue_depth: 5}
  teleop:
    label: 遥操控制
    mode: auto
    nodes: [/tracker_teleop]
  recorder:
    label: 远端数据记录
    mode: observe
    nodes: [/fastumi_recorder]
