# 该文件提供夹爪范围标定节点的默认 ROS 2 参数。
gripper_calibration:
  ros__parameters:
    source_mode: topic
    image_topic: /umi_camera/image_raw
    video_path: ''
    mcap_path: ''
    mcap_image_topic: ''
    video_fps: 30.0
    camera_calibration_path: ''
    output_path: ''
    overwrite: true
    publish_debug_image: false
    debug_image_topic: /gripper/calibration/debug_image
    marker_size_mm: 16.0
    dictionary_name: DICT_4X4_50
    left_finger_tag_id: 0
    right_finger_tag_id: 1
    roi_ratios: [0.0, 0.0, 1.0, 1.0]
    # 单帧质量门限：任一码重投影误差、两码较小像素边长、两码相对旋转偏离会话中位数。
    max_reprojection_error_px: 2.0
    min_marker_side_px: 20.0
    max_relative_rotation_deviation_deg: 10.0
    # 端点平台：连续 N 帧极差不超过 band 视为停留，端点取停留帧中位数。
    plateau_window_frames: 5
    plateau_band_mm: 1.5
    min_endpoint_frames: 5
    # 闭合与全开端点的最小距离差，防止静止录包产生退化标定。
    min_range_mm: 5.0
