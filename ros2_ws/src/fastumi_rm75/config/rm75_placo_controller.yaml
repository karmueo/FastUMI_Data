# Placo 关节控制器默认直接连接实机；首次联调请覆盖 dry_run:=true。
rm75_placo_controller:
  ros__parameters:
    dry_run: false
    urdf_path: ""
    # 低跟随按此频率执行；高跟随自动提升至至少 100 Hz（厂家要求周期 ≤10 ms）。
    # IK 步长同步调整，不改变速度上限；实际调度明显超期时输出 CANFD publish gap 告警。
    control_rate_hz: 50.0
    velocity_scale: 0.25
    joint_state_timeout_s: 0.25
    # 序列末点后保持该时长等待下一条预测，超时才停臂。实测推理延迟中位 0.26 s、P90 0.43 s，
    # 发布间隔 0.2 s，而每条序列仅覆盖 0.5 s，立即停臂会使机械臂走走停停；0 恢复立即停止。
    sequence_hold_s: 0.3
    # 位姿前瞻（s，0～0.5）。RM75 低跟随实测约为 80 ms 延迟 + 0.4 s 一阶滤波（rollout 2026-10-29
    # real_110713），按当前时间采样时实际速度仅为策略目标的约 40%。前瞻须配合推理节点
    # published_action_steps（最多 15 点 ≈ 467 ms），否则 8 点序列很快采到末点、收益有限。
    # 夹爪不前瞻；0 保持原行为。dp_infer_lerobot launch 以同名参数覆盖。
    lookahead_s: 0.0
    require_start_state: true
    # false：每个 episode 首次实机控制前须回到 initial_pose.yaml 起点。
    # true：允许从当前关节位置起步，仍要求七轴静止 start_joint_settle_s 秒、夹爪张开且反馈新鲜。
    start_from_current_pose: false
    task_control_enabled: false
    # 起始关节角只读取 fastumi_bringup/config/initial_pose.yaml，无需 launch 或命令行另设。
    start_joint_tolerance_rad: 0.035
    start_joint_settle_s: 0.5
    start_gripper_min: 0.95
    gripper_state_timeout_s: 0.25
    # 训练动作以 0 指令抓握；实际夹爪反馈最低约 0.35，不能把反馈下限误用为命令下限。
    gripper_command_min: 0.0
    # 视觉闭合门控：true 时须有新鲜的 close_approval_topic 许可且本轮已运行 close_min_episode_time_s
    # 才允许进一步闭合；默认 false，直接执行策略夹爪目标。dp_infer launch 以同名参数覆盖。
    require_close_approval: false
    close_approval_topic: /fastumi/policy/gripper_close_allowed
    close_approval_timeout_s: 0.25
    close_min_episode_time_s: 1.5
    # 夹爪刻度映射：两点线性，1.0↔1.0，policy_ref↔robot_ref，两者相等即恒等映射。
    # 控制器把宇树反馈换算到训练刻度后发布到 policy_gripper_state_topic，供推理节点作观测。
    # 手指 ArUco 码间距实测两种夹爪同一开度物理宽度一致，原取恒等映射 0.58↔0.58；但锁定全闭会把
    # 目标压到训练从未出现的读数（rollout 2026-10-26 episode_3 为 0.19，训练抓持最低 0.50），抓取后
    # 策略观测越界、无法放入碗中。现以锁定压紧读数 0.19 对应训练抓持开度 0.55，使抓持观测落回训练范围；
    # 代价是张开段下发宽度变窄（策略 0.83 → 宇树 0.69）。换目标物体后按其压紧读数重新设定 robot_ref。
    gripper_map_policy_ref: 0.55
    gripper_map_robot_ref: 0.19
    policy_gripper_state_topic: /fastumi/policy/gripper_state
    # 闭合锁定：策略开度（训练刻度）持续低于 close_threshold 达 close_confirm_s 秒后命令 grasp_command，
    # 借位置环误差产生夹持力；开度回升到 release_threshold 以上才释放。阈值取自训练集：
    # 张开段开度不低于 0.83，抓持段最低值 0.50–0.73。
    grasp_latch_enabled: true
    grasp_close_threshold: 0.75
    grasp_release_threshold: 0.82
    grasp_close_confirm_s: 0.15
    grasp_command: 0.0
    # 夹空检测：锁定 settle_s 秒后宇树原始反馈仍低于 miss_state 视为夹空，张开 reopen_s 秒后
    # 允许策略重试；连续 max_misses 次后停止本 episode。miss_state 为 0 关闭检测，
    # 建议取宇树空夹读数与夹住目标读数的中点。
    grasp_settle_s: 1.0
    grasp_reopen_s: 1.0
    # 宇树空夹到底实测约 0.031（rollout episode_4/6/7），锁定压紧玩偶约 0.32，取二者中点。
    grasp_miss_state: 0.18
    grasp_max_misses: 3
    # 不设 workspace_min/max：位置保护由 RM75 示教器虚拟墙负责；节点默认 ±10 m 仅保留非有限值检查。
    base_frame: base_link
    end_frame: Link7
    joint_state_topic: /joint_states
    gripper_state_topic: /motion_control/gripper_state
    reset_service: /fastumi/rm75/placo/reset_episode
    start_service: /fastumi/rm75/placo/start_task
    return_service: /fastumi/rm75/placo/return_to_start
    policy_topic: /fastumi/policy/action_sequence
    joint_command_topic: /rm_driver/movej_canfd_cmd
    # CANFD 跟随模式：auto 读取 driver_node 的 trajectory_mode（fastumi_bringup arm_follow_mode 设置），
    # 0 为低跟随，1/2 为高跟随；驱动不可读时回退低跟随。也可显式写 low / high。
    follow_mode: auto
    driver_node: /rm_driver
    gripper_command_topic: /motion_control/gripper_command
    debug_joint_topic: /fastumi/rm75/placo/joint_command
    stop_topic: /rm_driver/move_stop_cmd
