rm75_joint_controller:
  ros__parameters:
    dry_run: true
    control_rate_hz: 50.0
    velocity_scale: 0.25
    joint_state_timeout_s: 0.25
    gripper_state_timeout_s: 0.25
    # 起始关节角只读取 fastumi_bringup/config/initial_pose.yaml。
    start_joint_tolerance_rad: 0.035
    start_joint_settle_s: 0.5
    start_gripper_min: 0.95
    # 当前 initial_pose.yaml 起点的 Link7 高度约 0.148 m，下界留出约 8 mm 余量。
    workspace_min: [-0.6, -0.5, 0.14]
    workspace_max: [0.6, 0.5, 0.50]
    first_sequence_timeout_s: 2.0
