# 该文件定义 RM75 策略桥和标准平行夹爪的默认安全参数。
rm75_policy_bridge:
  ros__parameters:
    dry_run: true
    base_frame: base_link
    tcp_frame: fastumi_tcp
    relative_frame: episode_start_tcp
    policy_rate_hz: 20.0
    servo_rate_hz: 100.0
    workspace_min_m: [0.05, -0.70, 0.05]
    workspace_max_m: [0.90, 0.70, 1.00]
    joint_names:
      [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
    joint_min_deg: [-178.0, -130.0, -178.0, -135.0, -178.0, -128.0, -360.0]
    joint_max_deg: [178.0, 130.0, 178.0, 135.0, 178.0, 128.0, 360.0]
    maximum_step_translation_m: 0.02
    maximum_step_rotation_deg: 10.0
    state_timeout_s: 0.10
    target_timeout_s: 0.20
    require_robot_error_state: true
    image_topic: /xv_sdk/SN250801DR48FB26001253/rgb/image

gripper_bridge:
  ros__parameters:
    dry_run: true
    action_name: /gripper_controller/gripper_cmd
    closed_position_m: 0.0
    open_position_m: 0.07
    max_effort: 20.0
