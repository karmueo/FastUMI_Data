# 本文件定义 RM75 DP 推理节点（Link7 或 UMI TCP checkpoint）的 ROS 参数及默认输入输出话题。
dp_infer:
  ros__parameters:
    checkpoint: ""
    urdf_path: ""
    device: cuda:0
    # 示例旧 checkpoint 未内嵌训练 URDF 摘要；更换模型时核对训练 URDF。
    expected_urdf_sha256: c37545834f0d6a4719548e51337a258be0c3b95bb6b79467d835875a205bb056
    image_topic: /usb_camera/image_raw
    joint_topic: /joint_states
    gripper_topic: /gripper/openness
    output_topic: /fastumi/policy/action_sequence
    reset_service: /fastumi/policy/reset_episode
    sync_slop_s: 0.05
    input_timeout_s: 0.2
    history_tolerance_s: 0.015
    max_inference_hz: 10.0
    result_timeout_s: 0.5
    postprocessors: ""
    # 仅 TCP checkpoint（fastumi-tcp-v1 训练）使用：部署相机←Link7 与部署相机←TCP 外参，
    # 例如仓库 config/calibration/T_cam_end.yaml 与 T_d_cam_tcp.yaml；Link7 checkpoint 必须留空。
    end_camera_extrinsic: ""
    deploy_tcp_extrinsic: ""
    # 示教 TCP 与部署 TCP 坐标轴允许的最大夹角（度）。
    max_tcp_axis_deg: 10.0
