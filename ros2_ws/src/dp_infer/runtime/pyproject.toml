# 本文件固定 DP 推理环境依赖；ROS 二进制模块来自 Jazzy 系统环境。
[project]
name = "fastumi-dp-infer-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "diffusers==0.18.2",
    "dill==0.3.7",
    "einops==0.8.2",
    "huggingface-hub>=0.20,<0.26",
    "hydra-core==1.3.4",
    "numpy==1.26.4",
    "omegaconf>=2.3,<2.4",
    "opencv-contrib-python==4.11.0.86",
    "scipy==1.13.1",
    "setuptools==68.1.2",
    "timm==0.9.7",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "zarr==2.18.7",
    "numcodecs==0.12.1",
]

[dependency-groups]
test = ["pytest>=8.0,<9"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv]
package = false
