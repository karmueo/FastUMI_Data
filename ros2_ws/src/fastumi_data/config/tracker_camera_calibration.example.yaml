# Tracker–鱼眼相机离线外参标定的默认运行参数。
topics:
  image: /tof_stereo_camera/rgb/image_raw
  tracker_pose: /vive_tracker/odom
  tracker_status: /vive_tracker/status

target:
  tag_family: tag36h11

filtering:
  frame_stride: 2
  min_tags: 6
  max_pose_gap_ms: 50.0
  # Tracker 漂移或重定位已确认时，可限制首帧后的有效标定时长。
  sample_end_offset_s: null

optimization:
  time_offset_min_ms: -100.0
  time_offset_max_ms: 100.0
  time_offset_step_ms: 2.0

quality:
  minimum_valid_frames: 30
  validation_median_max_px: 1.0
  validation_p95_max_px: 2.0
  closure_translation_max_mm: 5.0
  closure_rotation_max_deg: 1.0
intrinsics:
  # 省略 --camera-config 时，按该频率从 MCAP 抽取 Image 并运行 Kalibr。
  frequency_hz: 4.0
