# Tracker–鱼眼相机离线外参标定的默认运行参数。
topics:
  image: /xv_sdk/SN250801DR48FB26001253/rgb/image
  tracker_pose: /vive_tracker/pose
  tracker_status: /vive_tracker/status

target:
  tag_family: tag36h11

filtering:
  frame_stride: 2
  min_tags: 6
