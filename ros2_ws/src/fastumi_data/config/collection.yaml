# 该文件保存 collection_node 的默认参数，launch 命令行参数会覆盖其中同名项。
collection_node:
  ros__parameters:
    # 数据集根目录；相对路径相对于启动目录。内含暂存区 .staging 和回收区 .trash。
    dataset_root: dataset
    # 图像消息模式：raw（sensor_msgs/Image）、compressed（JPEG/PNG 的
    # sensor_msgs/CompressedImage）或 h264（无 B 帧、每包一个访问单元的
    # ffmpeg_image_transport_msgs/FFMPEGPacket）。MCAP 原样保存收到的消息。
    image_mode: raw
    # 三路输入及 episode 事件话题，可按设备实际命名重映射。图像话题留空时
    # 按 image_mode 使用 /umi_camera/image_raw、.../image_raw/compressed 或
    # .../image_raw/ffmpeg；显式给出的话题优先，并核对发布端消息类型。
    image_topic: ""
    # 在线解码后发布的原始图像话题，供夹爪估计和 RViz 使用；仅记入会话清单。
    decoded_image_topic: /umi_camera/image_decoded
    # 图像订阅 QoS。默认 best_effort 兼容当前相机发布端；reliable 须发布端
    # 也是 RELIABLE，开始前检查会核对。
    image_reliability: best_effort
    image_qos_depth: 30
    # h264 模式下 starting 状态等待首个含 SPS/PPS 和 IDR 的关键帧的最长秒数。
    h264_start_timeout_s: 5.0
    tracker_pose_topic: /vive_tracker/pose
    tracker_status_topic: /vive_tracker/status
    gripper_state_topic: /gripper/state
    episode_event_topic: /fastumi/episode/events
    tf_static_topic: /tf_static
    # 空字符串表示使用本包默认 processing.yaml；采集会把实际话题映射写入快照。
    processing_config: ""
    # 可选 Tracker 到 TCP 外参；为空时记录标记为 uncalibrated。
    extrinsic_path: ""
    # 额外复制到 calibration_snapshot/ 的文件，例如相机内参和夹爪标定。
    snapshot_files: [""]
    # 新鲜度超时，单位秒，使用单调接收时钟。
    image_timeout_s: 1.0
    tracker_timeout_s: 0.25
    gripper_timeout_s: 0.25
    # 图像与 Tracker 按最近源时间戳配对的窗口，单位秒。
    match_window_s: 0.030
    # 绝对频率检查：开始前须积累完整窗口，编码图像与有效夹爪状态的源时间戳速率和
    # 接收速率都达到期望频率 × min_rate_ratio（默认 30 Hz × 0.95 = 28.5 Hz）。
    # 录制中连续低于门限 low_rate_persist_s 报 IMAGE_LOW_RATE/GRIPPER_LOW_RATE，
    # 连续达标同样时长后清除。期望频率为 0 时不检查该路。launch 按相机帧率覆盖。
    rate_window_s: 2.0
    expected_image_rate_hz: 30.0
    expected_gripper_rate_hz: 30.0
    min_rate_ratio: 0.95
    low_rate_persist_s: 2.0
    # 相邻有效夹爪样本允许的最大源时间间隔（秒）：连续无效到下一帧恢复也会超过该值时
    # 才报 GRIPPER_INVALID，偶发单帧漏检不报警；与离线转换的 max_gripper_gap_s 对齐，
    # 0 表示单帧无效即报警。
    gripper_invalid_persist_s: 0.2
    # 确认生效的标称源帧率及来源，写入 session.yaml 供离线转换选择选帧路径；
    # 0.0 表示未知（外部相机须通过 launch 的 external_camera_fps 声明）。
    nominal_source_fps: 0.0
    nominal_source_fps_source: unknown
    # 图像 Header 时间戳来源，写入清单；本地相机由 launch 按相机节点实际行为设置。
    image_timestamp_source: unrecorded
    # 写入队列上限；溢出会使本次采集失败，不会静默丢帧。
    queue_max_messages: 600
    queue_max_mib: 768.0
    # 停止时等待排空并关闭 MCAP 的最长秒数。
    finish_timeout_s: 60.0
    # 开始采集所需的最小磁盘可用空间，单位 GiB。
    min_free_disk_gib: 2.0
    # 周期状态发布频率，单位 Hz。
    status_rate_hz: 2.0
